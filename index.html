<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniture Emporium</title>
  
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <h1>Furniture Emporium</h1>
  </header>

  <main class="product-container">
    <article class="product-card">
      <img src="chair.jpg" alt="Modern Wooden Chair" class="product-image">
      <h2 class="product-title">Modern Oak Chair</h2>
      <p class="product-description">Solid wood dining chair with an ergonomic cushioned seat.</p>
      <p class="product-price">$149.99</p>
      
      <button type="button" class="btn-add-to-cart">Add to cart</button>
    </article>
  </main>
</body>
</html>
